# Render blueprint for the Pokemon TCG multiplayer app.
#
# Apply via Render dashboard: New → Blueprint → point at the repo → Apply.
# Render provisions one Node web service + one free Postgres DB, runs the
# build, and starts the server. The Koa server serves both the static
# Vite build (dist/) and the boardgame.io API + custom /api/* endpoints
# from the same port, so no static-site service is required.

services:
  - type: web
    name: pokemon-tcg-boardgameio
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      # Cap V8 heap below Render's 512 MB starter limit so Node GCs aggressively
      # instead of being OOM-killed by the container. Bump to ~1800 if you
      # upgrade to the Standard plan (2 GB RAM).
      - key: NODE_OPTIONS
        value: --max-old-space-size=420
      - key: DATABASE_URL
        fromDatabase:
          name: pokemon-tcg-db
          property: connectionString
      - key: PGSSLMODE
        value: require
      - key: ALLOW_ORIGIN
        sync: false
      - key: BGIO_STORAGE_DIR
        value: /tmp/bgio-storage
      # Public origin of this service. Also becomes the ERC-721 base URI
      # when you deploy contracts/, so tokenURI resolves to
      # <PUBLIC_ORIGIN>/api/cards/<cardId>/metadata.
      - key: PUBLIC_ORIGIN
        sync: false
      # ----- Robinhood Chain (EVM, chain id 4663) -------------------------
      # $POKETCG ERC-20, launched through the Pons v2 factory. The live
      # token (Pokemasters / POKE) is now the hard-coded default in
      # src/chain/config.ts, so these two are OPTIONAL overrides — set them
      # only to point a deployment at a different token. Both hold the same
      # value: the server reads POKETCG_TOKEN_ADDRESS at runtime, and Vite
      # inlines VITE_POKETCG_TOKEN_ADDRESS into the browser bundle at BUILD
      # time — so the VITE_ one must be set BEFORE the build, not just
      # before the start command.
      - key: POKETCG_TOKEN_ADDRESS
        sync: false
      - key: VITE_POKETCG_TOKEN_ADDRESS
        sync: false
      # PokemonCardNFT (ERC-721) from contracts/. Same build-time caveat.
      - key: CARD_NFT_ADDRESS
        sync: false
      - key: VITE_CARD_NFT_ADDRESS
        sync: false
      # Treasury key that mints card NFTs and pays their gas. Keep it
      # funded with ETH on chain 4663. Without it the server still grants
      # cards in-game, it just skips minting.
      - key: RHC_TREASURY_PRIVATE_KEY
        sync: false
      # Optional: override the Robinhood Chain RPC endpoint. Defaults to
      # https://rpc.mainnet.chain.robinhood.com on both sides.
      - key: RHC_RPC_URL
        sync: false
      - key: VITE_RHC_RPC_URL
        sync: false

databases:
  - name: pokemon-tcg-db
    plan: free
    region: oregon
    postgresMajorVersion: 16
